[platformio]
default_envs = m5stack-core-esp32
src_dir = .

[env:base_esp32]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Stack
    bblanchon/ArduinoJson
    adafruit/Adafruit NeoPixel
build_flags =
    -DARDUINOJSON_USE_LONG_LONG=1

[env:m5stack-core-esp32]
extends = env:base_esp32
board = m5stack-core-esp32

[env:m5stack-core2]
extends = env:base_esp32
board = m5stack-core2
lib_deps =
    ${env:base_esp32.lib_deps}
    m5stack/M5Core2

[env:native]
platform = native
test_framework = unity
test_filter = native/*
lib_deps =
    bblanchon/ArduinoJson
build_flags = -std=c++17 -Wall -Wextra -DARDUINOJSON_USE_LONG_LONG=1
